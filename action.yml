name: Unmerged PR Branch Cleaner
description: Safely delete branches belonging to closed, unmerged pull requests.
author: ostk0069
branding:
  icon: trash-2
  color: red
inputs:
  github-token:
    description: A token with Pull requests and Contents read access for dry runs; actual deletion requires Contents write.
    required: false
    default: ${{ github.token }}
  dry-run:
    description: Report branches without deleting them.
    required: false
    default: "true"
outputs:
  deleted-count:
    description: Number of deleted branches.
  deleted-branches:
    description: JSON array of deleted branch names.
  skipped-branches:
    description: JSON array of skipped branches and reasons.
  failed-branches:
    description: JSON array of failed branches and reasons.
runs:
  using: node24
  main: dist/index.js
